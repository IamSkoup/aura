<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151515" />
    <meta name="description" content="Aura Wear — демонстрация каталога и 3D-конструктора одежды. Проекты сохраняются в вашем браузере; заказы и оплата не принимаются." />
    <title>Aura Wear — Твой стиль. Твои правила.</title>
    <script>try{const choice=localStorage.getItem('aura-theme')||'system';document.documentElement.dataset.theme=choice==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):choice;}catch{document.documentElement.dataset.theme='light'}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
